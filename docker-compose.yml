version: '3.8'

services:
  backend:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
    ports: 
      - "8000:8000"
    volumes:
      - .:/app

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - backend